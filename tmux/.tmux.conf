### Fix terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",tmux-256color:Tc"

### BINDINGS
unbind '"'
unbind %
bind | split-window -h
bind _ split-window -v

# reload config file
bind r source-file ~/.tmux.conf

### For tmux ver > 1.8
# vi Mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -sg escape-time 5
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

### For old tmux ver <= 1.8
# # Enable mouse support (for scrolling and selection)
# # older versions of tmux do not have support for the vi style copy mode
# set -g mode-mouse on
# set -g mouse-select-pane on
# set -g mouse-resize-pane on
# set -g mouse-select-window on


### DESIGN TWEAKS
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set -g status-position top

# Start numbering at 1
set -g base-index 1

run '~/.my-scripts/detect-venv.sh'

# Theme (Material You colors, auto-generated by matugen)
# Fallback defaults, used only until matugen has generated ~/.tmux/colors.conf
# for the first time. The values don't matter much - matugen overwrites them
# below - but the variable names must match what the template writes.
set -g status-bg              "#1b1b1f"
set -gq @thm_bar_bg           "#1b1b1f"
set -gq @thm_bg               "#1b1b1f"
set -gq @thm_fg               "#e4e2e6"
set -gq @thm_primary          "#aac7ff"
set -gq @thm_inverse_primary  "#375a7f"
set -gq @thm_surface_low      "#131316"
set -gq @thm_surface          "#232327"
set -gq @thm_surface_variant  "#2c2c31"
set -gq @thm_outline          "#8f9099"
set -gq @thm_text_variant     "#c5c6d0"
 
# Load matugen-generated colors, overriding the defaults above.
# '-q' silences the "no such file" error the first time, before matugen has run.
source-file -q ~/.tmux/colors.conf
 
set -g status-style "bg=#{@thm_bar_bg},fg=#{@thm_fg}"
set -g window-active-style "bg=#{@thm_bg},fg=#{@thm_fg}"
 
setw -g window-status-current-style "bg=#{@thm_primary},fg=#{@thm_bar_bg}"
setw -g window-status-style "fg=#{@thm_text_variant},bg=#{@thm_bar_bg}"
 
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=#{@thm_primary}]PREFIX ,}"
set -ag status-right "#[fg=#{@thm_text_variant},bg=#{@thm_surface_variant}] #S "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_outline}] #{pane_current_command} "
 
#### PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# This initializes the tmux plugin manager -- needs to always be on the bottom of file
run '~/.tmux/plugins/tpm/tpm'
